# Use with: docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
# TLS_CERT_DIR must contain fullchain.pem and privkey.pem for your hostname.
services:
  web:
    environment:
      DJANGO_SECURE_SSL_REDIRECT: "1"
      DJANGO_SESSION_COOKIE_SECURE: "1"
      DJANGO_CSRF_COOKIE_SECURE: "1"
      DJANGO_ENABLE_HSTS: "1"
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:?Set TLS_CERT_DIR to your certificate directory}:/etc/nginx/certs:ro
