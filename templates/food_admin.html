<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yemək İdarəsi - Lunch Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; }
        .amber-btn {
            background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%);
            box-shadow: 0 4px 20px 0 rgba(251, 133, 0, 0.45);
        }
        .amber-btn:hover {
            background: linear-gradient(135deg, #ffc300 0%, #ffb703 100%);
            box-shadow: 0 8px 25px 0 rgba(255, 183, 3, 0.65);
        }
        .interactive-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; }
        .interactive-btn:hover { transform: translateY(-2px) scale(1.03); }
        .interactive-btn:active { transform: translateY(0px) scale(0.96); }
        #toast { transition: all 0.3s ease-in-out; transform: translateY(-100px); opacity: 0; }
        #toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

    <!-- Toast -->
    <div id="toast" class="fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700 pointer-events-none">
        <div class="w-8 h-8 rounded-xl bg-amber-400/20 text-amber-400 flex items-center justify-center font-bold">
            <i class="fa-solid fa-bell"></i>
        </div>
        <div>
            <p id="toast-title" class="text-xs font-bold text-white"></p>
            <p id="toast-msg" class="text-[11px] text-slate-400"></p>
        </div>
    </div>

    <!-- Access gate -->
    <div id="gate" class="fixed inset-0 z-40 bg-slate-950 hidden items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-8 text-center max-w-sm">
            <i class="fa-solid fa-lock text-3xl text-slate-400 mb-3 block"></i>
            <p id="gateMsg" class="text-xs font-bold text-slate-600">Yüklənir...</p>
        </div>
    </div>

    <div id="appScreen" class="hidden">
        <header class="sticky top-0 z-40 bg-slate-900 text-white shadow-lg">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-amber-400 flex items-center justify-center text-slate-950 font-black shadow-md shadow-amber-400/30">
                        <i class="fa-solid fa-bowl-food text-lg"></i>
                    </div>
                    <span class="font-extrabold text-xl tracking-tight text-white">Yemək <span class="text-amber-400">İdarəsi</span></span>
                </div>
                <a href="/" class="flex items-center gap-2 text-xs font-bold bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition">
                    <i class="fa-solid fa-arrow-left text-amber-400"></i> Tətbiqə qayıt
                </a>
            </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

            <!-- Restaurants column -->
            <section class="lg:col-span-5 space-y-5">
                <div class="glass-card rounded-3xl p-6 shadow-sm">
                    <h2 class="font-bold text-slate-900 flex items-center gap-2 mb-4">
                        <i class="fa-solid fa-store text-amber-600"></i> Restoranlar
                        <span id="restCount" class="ml-auto text-[10px] font-extrabold text-slate-500 bg-slate-100 px-2 py-1 rounded-md"></span>
                    </h2>

                    <div class="space-y-2 mb-5 max-h-96 overflow-y-auto pr-1" id="restaurantList"></div>

                    <details open class="border-t border-slate-100 pt-4">
                        <summary class="text-xs font-bold text-slate-700 cursor-pointer flex items-center gap-2">
                            <i class="fa-solid fa-plus text-emerald-600"></i> Yeni Restoran Əlavə Et
                        </summary>
                        <div class="mt-3 space-y-2">
                            <input id="nrName" type="text" placeholder="Restoran adı"
                                   class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:border-amber-400">
                            <select id="nrCuisine"
                                    class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:border-amber-400">
                                <option value="european">European</option>
                                <option value="turkish">Türk</option>
                                <option value="asian">Asiya</option>
                                <option value="national">Milli</option>
                            </select>
                            <div class="grid grid-cols-2 gap-2">
                                <input id="nrPrice" type="number" step="0.5" min="0" placeholder="Orta qiymət AZN"
                                       class="px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:border-amber-400">
                                <input id="nrAddress" type="text" placeholder="Ünvan"
                                       class="px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:border-amber-400">
                            </div>
                            <button onclick="createRestaurant()" class="w-full amber-btn interactive-btn text-slate-950 font-bold text-xs py-3 rounded-xl">Restoran Yarat</button>
                        </div>
                    </details>
                </div>
            </section>

            <!-- Menu items column -->
            <section class="lg:col-span-7 space-y-5">
                <div class="glass-card rounded-3xl p-6 shadow-sm">
                    <h2 class="font-bold text-slate-900 flex items-center gap-2 mb-4">
                        <i class="fa-solid fa-bowl-food text-amber-600"></i>
                        <span id="menuTitle">Menyu</span>
                        <span id="menuCount" class="ml-auto text-[10px] font-extrabold text-slate-500 bg-slate-100 px-2 py-1 rounded-md"></span>
                    </h2>

                    <div id="menuEmpty" class="rounded-2xl bg-slate-50 border border-dashed border-slate-200 p-8 text-center text-xs font-semibold text-slate-400">
                        Soldan restoran seçin və ya yaradın.
                    </div>

                    <div id="menuSection" class="hidden space-y-5">
                        <div class="space-y-2 max-h-80 overflow-y-auto pr-1" id="menuList"></div>

                        <details open class="border-t border-slate-100 pt-4">
                            <summary class="text-xs font-bold text-slate-700 cursor-pointer flex items-center gap-2">
                                <i class="fa-solid fa-plus text-emerald-600"></i> Yemək Əlavə Et
                            </summary>
                            <div class="mt-3 space-y-2">
                                <input id="miName" type="text" placeholder="Yeməyin adı"
                                       class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:border-amber-400">
                                <input id="miDesc" type="text" placeholder="Təsvir (isteğe bağlı)"
                                       class="w-full px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:border-amber-400">
                                <div class="grid grid-cols-2 gap-2 items-center">
                                    <input id="miPrice" type="number" step="0.1" min="0" placeholder="Qiymət AZN"
                                           class="px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs font-semibold focus:outline-none focus:border-amber-400">
                                    <label class="flex items-center gap-2 text-[11px] font-bold text-slate-600 px-2">
                                        <input id="miVeg" type="checkbox" class="rounded border-slate-300"> Vegetarian
                                    </label>
                                </div>
                                <button onclick="createMenuItem()" class="w-full amber-btn interactive-btn text-slate-950 font-bold text-xs py-3 rounded-xl">Menyuya Əlavə Et</button>
                            </div>
                        </details>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/static/food_admin.js"></script>
</body>
</html>
