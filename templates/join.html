<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komandaya Qoşul - Lunch Picker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-card { background: #ffffff; border: 1px solid #e2e8f0; }
        .amber-btn { background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%); box-shadow: 0 4px 20px 0 rgba(251,133,0,0.45); }
        .amber-btn:hover { background: linear-gradient(135deg, #ffc300 0%, #ffb703 100%); }
        #toast { transition: all 0.3s ease-in-out; transform: translateY(-100px); opacity: 0; }
        #toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <div id="toast" class="fixed top-5 right-5 z-50 flex items-center gap-3 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl border border-slate-700 pointer-events-none">
        <div class="w-8 h-8 rounded-xl bg-amber-400/20 text-amber-400 flex items-center justify-center font-bold"><i class="fa-solid fa-bell"></i></div>
        <div><p id="toast-title" class="text-xs font-bold"></p><p id="toast-msg" class="text-[11px] text-slate-400"></p></div>
    </div>

    <header class="bg-slate-900 text-white h-16 flex items-center">
        <div class="max-w-3xl mx-auto w-full px-4 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-amber-400 flex items-center justify-center text-slate-950 font-black"><i class="fa-solid fa-utensils"></i></div>
            <span class="font-extrabold text-xl">Lunch<span class="text-amber-400">Picker</span></span>
            <a href="/" class="ml-auto text-xs font-bold bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl transition">Ana səhifə</a>
        </div>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="glass-card rounded-3xl p-8 max-w-md w-full shadow-xl text-center space-y-5">
            <div id="loading" class="py-6"><i class="fa-solid fa-spinner fa-spin text-2xl text-slate-400"></i><p class="text-xs font-semibold text-slate-400 mt-2">Dəvət yoxlanılır...</p></div>

            <div id="previewBox" class="hidden space-y-4">
                <div class="w-16 h-16 rounded-2xl bg-amber-400 flex items-center justify-center text-slate-900 text-2xl mx-auto"><i class="fa-solid fa-users"></i></div>
                <div>
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Dəvət</p>
                    <h1 id="teamName" class="text-2xl font-extrabold text-slate-900">—</h1>
                    <p id="inviteStatus" class="text-xs text-slate-500 mt-1"></p>
                </div>
                <button id="joinBtn" onclick="joinTeam()" class="w-full amber-btn text-slate-950 font-bold text-sm py-3 rounded-xl">Komandaya Qoşul</button>
                <p id="joinMsg" class="text-xs font-semibold"></p>
            </div>

            <div id="errorBox" class="hidden space-y-3">
                <div class="w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto"><i class="fa-solid fa-triangle-exclamation"></i></div>
                <p id="errorText" class="text-sm font-bold text-slate-700"></p>
                <a href="/" class="inline-block text-xs font-bold text-amber-700 underline">Ana səhifəyə qayıt</a>
            </div>
        </div>
    </main>

<script src="/static/api.js"></script>
<script>
const token = window.location.pathname.split('/').filter(Boolean).pop();

function showToast(t,m){ document.getElementById('toast-title').innerText=t; document.getElementById('toast-msg').innerText=m; const el=document.getElementById('toast'); el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),3000); }

async function api(path, method='GET', body=null) { try { return await window.lunchClient.request(path, method, body); } catch (error) { if (error.status === 401) { localStorage.setItem('pending_join', token); location.href = '/?join=' + token; } throw error.data || error; } }

async function init(){
    try{
        // unauthenticated preview
        const data = await fetch('/api/join/'+token+'/preview/').then(r=>r.json().then(j=>({ok:r.ok, j})));
        if(!data.ok) throw data.j;
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('previewBox').classList.remove('hidden');
        document.getElementById('teamName').innerText = data.j.team_name;
        document.getElementById('inviteStatus').innerText = 'Bu komandaya qoşulmaq üçün dəvət almısınız.';

        // if already authenticated, check membership
        if(localStorage.getItem('access')){
            try{
                const full = await api('/join/'+token+'/', 'GET');
                if(full.already_member){
                    localStorage.setItem('active_team', full.team.id);
                    document.getElementById('inviteStatus').innerText = 'Artıq bu komandanın üzvüsünüz.';
                    document.getElementById('joinBtn').innerText = 'Tətbiqə keç';
                    document.getElementById('joinBtn').onclick = ()=> window.location.href='/';
                }
            }catch(_){}
        }
    }catch(e){
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('errorBox').classList.remove('hidden');
        document.getElementById('errorText').innerText = e.detail || 'Bu dəvət linki etibarsızdır və ya müddəti bitib.';
    }
}

async function joinTeam(){
    const btn=document.getElementById('joinBtn');
    const msg=document.getElementById('joinMsg');
    if(!localStorage.getItem('access')){
        localStorage.setItem('pending_join', token);
        window.location.href='/?join='+token;
        return;
    }
    btn.disabled=true; btn.innerText='Qoşulunur...';
    try{
        const joined = await api('/join/'+token+'/', 'POST', {});
        localStorage.setItem('active_team', joined.team);
        msg.className='text-xs font-bold text-emerald-600';
        msg.innerText='Uğurla qoşuldunuz! Yönləndirilirsiniz...';
        showToast('Uğurlu','Komandaya qoşuldunuz');
        setTimeout(()=> window.location.href='/', 1200);
    }catch(e){
        msg.className='text-xs font-bold text-rose-600';
        msg.innerText = e.detail || 'Xəta baş verdi.';
        btn.disabled=false; btn.innerText='Komandaya Qoşul';
    }
}
init();
</script>
</body>
</html>
