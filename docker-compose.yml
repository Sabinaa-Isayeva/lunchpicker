services:
  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: lunchpicker
      POSTGRES_USER: lunchpicker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lunchpicker-local-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchpicker"]
      interval: 5s
      retries: 10

  web:
    build: .
    environment: &app_environment
      # switches settings.py to Postgres when present
      DATABASE_URL: postgresql://lunchpicker:${POSTGRES_PASSWORD:-lunchpicker-local-password}@db:5432/lunchpicker
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-development-only-change-this-secret-before-deployment}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,web,nginx,testserver}
      DJANGO_SECURE_SSL_REDIRECT: "0"
      CACHE_URL: redis://cache:6379/1
    volumes:
      - static_files:/app/staticfiles
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://localhost:8000/health/', headers={'Host': os.environ.get('DJANGO_ALLOWED_HOSTS', 'localhost').split(',')[0]}))"]
      interval: 5s
      retries: 20

  worker:
    build: .
    environment: *app_environment
    command: ["sh", "-c", "while true; do python manage.py process_sessions; sleep 60; done"]
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/static:ro
    restart: unless-stopped
    depends_on:
      web:
        condition: service_started

volumes:
  pgdata:
  static_files:
