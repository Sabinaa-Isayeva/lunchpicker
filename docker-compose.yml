services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: lunchpicker
      POSTGRES_USER: lunchpicker
      POSTGRES_PASSWORD: change-me-in-prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lunchpicker"]
      interval: 5s
      retries: 10

  web:
    build: .
    environment:
      # switches settings.py to Postgres when present
      DATABASE_URL: postgres://lunchpicker:change-me-in-prod@db:5432/lunchpicker
      DJANGO_SECRET_KEY: change-me-in-prod
      DJANGO_DEBUG: "0"
    volumes:
      - static_files:/app/staticfiles
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/static:ro
    depends_on:
      - web

volumes:
  pgdata:
  static_files:
